  <g stroke="#BC5A34" stroke-width="3.5" stroke-linecap="round">
    <line x1="298" y1="322" x2="262" y2="358"></line>
    <line x1="298" y1="322" x2="344" y2="344"></line>
  </g>
  <circle cx="262" cy="358" r="9" fill="#342A1D"></circle>
  <circle cx="344" cy="344" r="9" fill="#342A1D"></circle>
  <circle cx="298" cy="322" r="14" fill="#BC5A34" stroke="#342A1D" stroke-width="3.5"></circle>

  <!-- wordmark -->
