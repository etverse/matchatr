    <circle cx="220" cy="324" r="7"></circle><circle cx="262" cy="324" r="7"></circle><circle cx="346" cy="324" r="7"></circle>
    <circle cx="178" cy="366" r="7"></circle><circle cx="304" cy="366" r="7"></circle><circle cx="346" cy="366" r="7"></circle>
  </g>

  <!-- matched set A (sampled from the cohort): case + two controls -->
  <g stroke="#BC5A34" stroke-width="3.5" stroke-linecap="round">
