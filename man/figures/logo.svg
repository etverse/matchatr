  <polygon points="262,32 495.83,167 495.83,437 262,572 28.17,437 28.17,167" fill="none" stroke="#342A1D" stroke-width="2" stroke-linejoin="round" opacity="0.32"></polygon>

  <!-- source population (cohort), faint -->
  <g fill="none" stroke="#342A1D" stroke-width="2.5" opacity="0.30">
    <circle cx="178" cy="198" r="7"></circle><circle cx="220" cy="198" r="7"></circle><circle cx="262" cy="198" r="7"></circle><circle cx="304" cy="198" r="7"></circle><circle cx="346" cy="198" r="7"></circle>
